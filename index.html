<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食藥提示">
<meta name="theme-color" content="#5F7F9A">
<link rel="apple-touch-icon" href="icon.png">
<title>💊 食藥提示</title>
<style>
:root{
  --bg:#F6F4EF;
  --header:#5F7F9A;
  --text:#3A3F47;
  --text2:#7A8089;
  --card:#FFFFFF;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --accent:#8FB0CC;
  --accent-text:#4E6E8A;
  --green:#7DB58A;
  --grey-btn:#DAD7D0;
  --grey-btn-text:#8A8F96;
  --danger:#D48C8C;
  --orange:#E0AE78;
  --cancel:#E4E1DA;
  --cancel-text:#5B6066;
  --alarm1:#C97A7A;
  --alarm2:#D99090;
  --tag-empty-bg:#FAEBDC; --tag-empty-fg:#8B5A2B; --tag-empty-bd:#E9C9A4;
  --tag-full-bg:#E4F0E5;  --tag-full-fg:#3E6B49;  --tag-full-bd:#B6D6BC;
  --tag-meal-bg:#E3ECF5;  --tag-meal-fg:#36587A;  --tag-meal-bd:#B8CFE3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:20px;line-height:1.4;
  padding-bottom:calc(env(safe-area-inset-bottom) + 30px);
}
header{
  background:var(--header);color:#fff;text-align:center;
  padding:calc(env(safe-area-inset-top) + 18px) 20px 18px;
}
header h1{margin:0;font-size:30px;font-weight:700}
header .now{margin-top:6px;font-size:19px;opacity:.95}

main{padding:16px}

.card{
  background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow);border:3px solid transparent;
}
.card.next{border-color:var(--accent)}
.card.done{background:#EFEDE7;opacity:.85}
.nextlabel{color:var(--accent-text);font-size:18px;font-weight:700;margin-bottom:4px}
.time{font-size:34px;font-weight:700;letter-spacing:.5px}
.card.done .time{font-size:26px;color:var(--text2)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0 14px;flex-wrap:wrap}
.name{font-size:26px;font-weight:600}
.card.done .name{text-decoration:line-through;color:var(--text2)}

.tag{
  display:inline-block;padding:4px 12px;border-radius:999px;
  font-size:18px;font-weight:700;border:2px solid;
}
.tag.empty{background:var(--tag-empty-bg);color:var(--tag-empty-fg);border-color:var(--tag-empty-bd)}
.tag.full {background:var(--tag-full-bg); color:var(--tag-full-fg); border-color:var(--tag-full-bd)}
.tag.meal {background:var(--tag-meal-bg); color:var(--tag-meal-fg); border-color:var(--tag-meal-bd)}

.btn{
  display:block;width:100%;border:none;border-radius:16px;
  padding:18px;font-size:24px;font-weight:700;cursor:pointer;
  font-family:inherit;color:#fff;
}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.green{background:var(--green)}
.btn.grey{background:var(--grey-btn);color:var(--grey-btn-text);font-size:20px}
.btn.outline{background:#fff;color:var(--accent-text);border:3px solid var(--accent)}
.btn.accent{background:var(--accent)}
.btn.orange{background:var(--orange)}
.btn.danger{background:var(--danger)}
.btn.cancel{background:var(--cancel);color:var(--cancel-text)}

.editrow{display:flex;gap:10px;margin-top:12px}
.editrow .btn{font-size:20px;padding:14px}

.tools{margin-top:24px}
.tools .btn{margin-top:12px}
.hint{color:var(--text2);font-size:16px;margin:8px 6px 0;line-height:1.5}

/* 底部表單 */
.sheetbg{
  display:none;position:fixed;inset:0;background:rgba(58,63,71,.45);z-index:50;
}
.sheetbg.show{display:flex;align-items:flex-end}
.sheet{
  background:var(--bg);width:100%;border-radius:24px 24px 0 0;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
}
.sheet h2{margin:0 0 16px;font-size:26px}
.sheet label{display:block;font-size:19px;font-weight:700;margin:14px 0 6px;color:var(--text)}
.sheet input{
  width:100%;font-size:26px;padding:14px;border-radius:14px;
  border:2px solid #D6D3CC;background:#fff;color:var(--text);font-family:inherit;
}
.sheet input:focus{outline:none;border-color:var(--accent)}
.kinds{display:flex;gap:10px}
.kinds button{
  flex:1;padding:14px 4px;border-radius:14px;font-size:20px;font-weight:700;
  border:2px solid #D6D3CC;background:#fff;color:var(--text2);font-family:inherit;
}
.kinds button.sel.empty{background:var(--tag-empty-bg);color:var(--tag-empty-fg);border-color:var(--tag-empty-bd)}
.kinds button.sel.full {background:var(--tag-full-bg); color:var(--tag-full-fg); border-color:var(--tag-full-bd)}
.kinds button.sel.meal {background:var(--tag-meal-bg); color:var(--tag-meal-fg); border-color:var(--tag-meal-bd)}
.sheet .actions{display:flex;gap:12px;margin-top:22px}
.sheet .actions .btn{font-size:22px}

/* 響鬧全屏 */
#alarm{
  display:none;position:fixed;inset:0;z-index:100;color:#fff;
  padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 30px);
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  animation:flash 1.2s infinite;
}
#alarm.show{display:flex}
@keyframes flash{0%,100%{background:var(--alarm1)}50%{background:var(--alarm2)}}
.bell{font-size:90px;animation:shake .6s infinite}
@keyframes shake{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
#alarm h2{font-size:44px;margin:10px 0 24px}
.alarmlist{width:100%;max-width:420px}
.alarmitem{
  background:#fff;color:var(--text);border-radius:16px;padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;font-size:26px;font-weight:600;text-align:left;
}
#alarm .btn.green{max-width:420px;padding:26px;font-size:32px;margin-top:20px}
#alarm .btn.snooze{max-width:420px;margin-top:14px;background:rgba(255,255,255,.25);color:#fff;font-size:22px}
</style>
</head>
<body>

<header>
  <h1>💊 食藥提示</h1>
  <div class="now" id="now">—</div>
</header>

<main>
  <div id="list"></div>

  <div class="tools">
    <button class="btn outline" id="editBtn" onclick="toggleEdit()">✏️ 修改藥單</button>
    <button class="btn accent" id="addBtn" style="display:none" onclick="openForm(null)">➕ 加一行藥</button>
    <button class="btn orange" id="alarmBtn" onclick="toggleAlarm()">🔔 開啟響鬧</button>
    <div class="hint">⚠️ 響鬧要 App 開住喺畫面先會響，鎖機就唔會。想鎖機都有提示，請用下面「匯出到日曆」。</div>
    <button class="btn outline" onclick="exportICS()">📅 匯出到 iPhone 日曆（鎖機都會提）</button>
    <div class="hint">撳完會下載一個檔案，開佔它 → 揀「全部加入」，日曆就會每日準時提你。</div>
  </div>
</main>

<!-- 底部表單 -->
<div class="sheetbg" id="sheetbg" onclick="if(event.target===this)closeForm()">
  <div class="sheet">
    <h2 id="formTitle">加一行藥</h2>
    <label>⏰ 時間</label>
    <input type="time" id="fTime">
    <label>💊 藥名</label>
    <input type="text" id="fName" placeholder="例如：胃藥" maxlength="20">
    <label>🍚 幾時食</label>
    <div class="kinds">
      <button class="empty" data-k="empty" onclick="pickKind('empty')">空肚</button>
      <button class="full"  data-k="full"  onclick="pickKind('full')">飽肚</button>
      <button class="meal"  data-k="meal"  onclick="pickKind('meal')">食飯</button>
    </div>
    <div class="actions">
      <button class="btn cancel" onclick="closeForm()">取消</button>
      <button class="btn green" onclick="saveForm()">儲存</button>
    </div>
  </div>
</div>

<!-- 響鬧 -->
<div id="alarm">
  <div class="bell">🔔</div>
  <h2>夠鐘食藥！</h2>
  <div class="alarmlist" id="alarmList"></div>
  <button class="btn green" onclick="alarmDone()">✅ 食咗</button>
  <button class="btn snooze" onclick="alarmSnooze()">⏰ 10 分鐘後再提</button>
</div>

<script>
/* ===== 資料 ===== */
const STORE='medApp_v2';
const KIND={empty:'空肚',full:'飽肚',meal:'食飯'};
const DEFAULT=[
  {t:'07:00',n:'尿酸藥',k:'empty'},
  {t:'09:00',n:'胃藥',  k:'empty'},
  {t:'10:00',n:'食早餐',k:'meal'},
  {t:'10:00',n:'星星藥',k:'full'},
  {t:'15:00',n:'胃藥',  k:'empty'},
  {t:'16:00',n:'星星藥',k:'full'},
];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state=load();
let editing=false;
function load(){
  try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&Array.isArray(s.meds))return s;}catch(e){}
  return {meds:DEFAULT.map(m=>({id:uid(),...m})),taken:{},day:todayKey()};
}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function ensureDay(){
  if(state.day!==todayKey()){state.day=todayKey();state.taken={};alarmed={};snoozeUntil=null;save();}
}

/* ===== 顯示 ===== */
function fmt(t){
  const [h,m]=t.split(':').map(Number);
  let p,hh=h;
  if(h<6){p='凌晨'}else if(h<12){p='早上'}else if(h===12){p='中午'}else if(h<18){p='下午';hh=h-12}else{p='晚上';hh=h-12}
  return `${p} ${hh}:${pad(m)}`;
}
function render(){
  ensureDay();
  const meds=[...state.meds].sort((a,b)=>a.t.localeCompare(b.t));
  const nextT=(meds.find(m=>!state.taken[m.id])||{}).t;
  document.getElementById('list').innerHTML=meds.map(m=>{
    const done=!!state.taken[m.id], next=!done&&m.t===nextT;
    return `<div class="card ${done?'done':''} ${next?'next':''}">
      ${next?'<div class="nextlabel">⏰ 下一次</div>':''}
      <div class="time">${fmt(m.t)}</div>
      <div class="row"><span class="tag ${m.k}">${KIND[m.k]}</span><span class="name">${esc(m.n)}</span></div>
      <button class="btn ${done?'grey':'green'}" onclick="toggleTaken('${m.id}')">${done?'✅ 已經食咗（撳一下取消）':'✅ 食咗'}</button>
      ${editing?`<div class="editrow">
        <button class="btn outline" onclick="openForm('${m.id}')">✏️ 改</button>
        <button class="btn danger" onclick="del('${m.id}')">🗑 刪除</button></div>`:''}
    </div>`;
  }).join('')||'<div class="hint" style="text-align:center;font-size:20px">未有藥單，撳「修改藥單」加一行。</div>';
}
function toggleTaken(id){ensureDay();state.taken[id]=!state.taken[id];save();render();}
function clock(){
  const d=new Date();
  document.getElementById('now').textContent=`今日 ${d.getMonth()+1}月${d.getDate()}日　${fmt(pad(d.getHours())+':'+pad(d.getMinutes()))}`;
}

/* ===== 修改 ===== */
function toggleEdit(){
  editing=!editing;
  document.getElementById('editBtn').textContent=editing?'✔️ 完成修改':'✏️ 修改藥單';
  document.getElementById('editBtn').className='btn '+(editing?'accent':'outline');
  document.getElementById('addBtn').style.display=editing?'block':'none';
  render();
}
function del(id){
  const m=state.meds.find(x=>x.id===id);
  if(confirm(`確定刪除「${fmt(m.t)} ${m.n}」？`)){state.meds=state.meds.filter(x=>x.id!==id);save();render();}
}
let formId=null, formKind='empty';
function openForm(id){
  formId=id;
  const m=id?state.meds.find(x=>x.id===id):{t:'08:00',n:'',k:'empty'};
  document.getElementById('formTitle').textContent=id?'修改':'加一行藥';
  document.getElementById('fTime').value=m.t;
  document.getElementById('fName').value=m.n;
  pickKind(m.k);
  document.getElementById('sheetbg').classList.add('show');
}
function pickKind(k){
  formKind=k;
  document.querySelectorAll('.kinds button').forEach(b=>b.classList.toggle('sel',b.dataset.k===k));
}
function closeForm(){document.getElementById('sheetbg').classList.remove('show')}
function saveForm(){
  const t=document.getElementById('fTime').value, n=document.getElementById('fName').value.trim();
  if(!t){alert('請揀時間');return}
  if(!n){alert('請輸入藥名');return}
  if(formId){const m=state.meds.find(x=>x.id===formId);m.t=t;m.n=n;m.k=formKind;}
  else state.meds.push({id:uid(),t,n,k:formKind});
  save();closeForm();render();
}

/* ===== 響鬧 ===== */
let alarmOn=false, audioCtx=null, ringTimer=null, alarmed={}, snoozeUntil=null, snoozeIds=[], wakeLock=null;
function chime(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  [[880,0],[880,.18],[1046,.36]].forEach(([f,o])=>{
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type='sine';osc.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+o);
    g.gain.exponentialRampToValueAtTime(.6,t+o+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+o+.45);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t+o);osc.stop(t+o+.5);
  });
  if(navigator.vibrate)navigator.vibrate([300,150,300]);
}
async function toggleAlarm(){
  alarmOn=!alarmOn;
  const b=document.getElementById('alarmBtn');
  if(alarmOn){
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    await audioCtx.resume();
    chime();
    try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
    b.textContent='🔕 關閉響鬧';b.className='btn grey';
  }else{
    try{wakeLock&&wakeLock.release();}catch(e){}
    b.textContent='🔔 開啟響鬧';b.className='btn orange';
  }
}
function showAlarm(items){
  document.getElementById('alarmList').innerHTML=items.map(m=>
    `<div class="alarmitem"><span class="tag ${m.k}">${KIND[m.k]}</span>${esc(m.n)}</div>`).join('');
  document.getElementById('alarm').dataset.ids=items.map(m=>m.id).join(',');
  document.getElementById('alarm').classList.add('show');
  chime();
  clearInterval(ringTimer);ringTimer=setInterval(chime,1500);
}
function hideAlarm(){clearInterval(ringTimer);document.getElementById('alarm').classList.remove('show');}
function alarmIds(){return (document.getElementById('alarm').dataset.ids||'').split(',').filter(Boolean)}
function alarmDone(){alarmIds().forEach(id=>state.taken[id]=true);save();hideAlarm();render();}
function alarmSnooze(){snoozeIds=alarmIds();snoozeUntil=Date.now()+10*60*1000;hideAlarm();}
function check(){
  ensureDay();
  if(!alarmOn)return;
  const now=new Date(), hm=pad(now.getHours())+':'+pad(now.getMinutes());
  if(snoozeUntil&&Date.now()>=snoozeUntil){
    snoozeUntil=null;
    const items=state.meds.filter(m=>snoozeIds.includes(m.id)&&!state.taken[m.id]);
    if(items.length){showAlarm(items);return}
  }
  const due=state.meds.filter(m=>m.t===hm&&!state.taken[m.id]&&!alarmed[m.id]);
  if(due.length){due.forEach(m=>alarmed[m.id]=true);showAlarm(due);}
}

/* ===== 匯出日曆 ===== */
function exportICS(){
  const d=new Date(), ymd=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const stamp=ymd+'T'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MedReminder//HK','CALSCALE:GREGORIAN','X-WR-CALNAME:食藥提示'];
  state.meds.forEach(m=>{
    const [h,mi]=m.t.split(':').map(Number);
    const end=new Date(2000,0,1,h,mi+5);
    L.push('BEGIN:VEVENT',
      `UID:${m.id}@medreminder`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${ymd}T${pad(h)}${pad(mi)}00`,
      `DTEND:${ymd}T${pad(end.getHours())}${pad(end.getMinutes())}00`,
      'RRULE:FREQ=DAILY',
      `SUMMARY:💊 ${m.n}（${KIND[m.k]}）`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:夠鐘食藥：${m.n}`,'TRIGGER:PT0M','END:VALARM',
      'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='食藥提示.ics';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}

/* ===== 啟動 ===== */
render();clock();
setInterval(clock,1000);
setInterval(check,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();check();}});
</script>
</body>
</html>
